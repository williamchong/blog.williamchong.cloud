<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preload" href="{{ "/assets/main.css" | relative_url }}" as="style">
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
  <link rel="preload" href="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}" as="script">
  {%- endif -%}
  {%- if site.threads_username -%}
  <link rel="me" href="https://www.threads.net/@{{ site.threads_username }}">
  {%- endif -%}
  {%- seo -%}
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  {%- feed_meta -%}
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
  {%- include google-analytics.html -%}
  {%- endif -%}
</head>
